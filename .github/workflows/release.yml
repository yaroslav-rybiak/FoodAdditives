name: Release to Google Play

# Builds a signed app bundle and uploads it to Google Play.
#
# Runs when a tag like v2.0.0 is pushed (goes to the internal testing track), or when started
# by hand from the Actions tab, where the track can be chosen.
# One-time setup of the signing key, the Play service account and the secrets is described
# in docs/RELEASING.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to release to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Release status (use "draft" until the app's first release is published)
        type: choice
        default: completed
        options: [completed, draft]
      version_name:
        description: Version name, e.g. 2.0.1 (leave empty to use the one in app/build.gradle)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets live in this environment; add required reviewers to it for a manual approval step.
    environment: play-store
    env:
      TRACK: ${{ inputs.track || 'internal' }}
      STATUS: ${{ inputs.status || 'completed' }}
      INPUT_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Work out the version
        id: version
        run: |
          # Play needs a version code that grows with every upload. The run number does that;
          # the offset keeps it above the codes used before this pipeline existed.
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "name=$INPUT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_VERSION_NAME" ]; then
            echo "::error::version_name must look like 2.0.1"
            exit 1
          fi

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Test and build the signed bundle
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          args=("-PversionCode=$VERSION_CODE")
          if [ -n "$VERSION_NAME" ]; then args+=("-PversionName=$VERSION_NAME"); fi
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:bundleRelease "${args[@]}"

      - name: Check that the bundle is signed
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the bundle and the R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yrybiak.foodadditives
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          whatsNewDirectory: distribution/whatsnew
